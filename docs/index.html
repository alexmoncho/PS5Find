<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consolas GTA VI</title>
<meta name="description" content="Anuncios de PS5 y Xbox Series que cumplen tus filtros">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consolas">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #047857; --warn: #b45309; --chip: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111827; --text: #f3f4f6; --muted: #9ca3af; --line: #1f2937;
      --accent: #3b82f6; --accent-text: #ffffff; --ok: #34d399; --warn: #fbbf24; --chip: #1f2937;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  header { padding: 16px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  button, .btn {
    font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); text-decoration: none; display: inline-block;
  }
  button.sec { background: var(--chip); color: var(--text); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .panel p { margin: 6px 0; }
  textarea { width: 100%; min-height: 90px; font: 12px ui-monospace, monospace; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 8px; }
  .chips { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; }
  .chip { background: var(--chip); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .lista { display: grid; gap: 10px; }
  a.anuncio { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; color: inherit; text-decoration: none; }
  .fila { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .titulo { font-weight: 600; overflow-wrap: anywhere; }
  .precio { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; }
  .entrega { color: var(--ok); }
  .vacio { text-align: center; color: var(--muted); padding: 32px 0; }
  .aviso-err { color: var(--warn); }
  .oculto { display: none; }
</style>
</head>
<body>
<header>
  <h1>Consolas GTA VI</h1>
  <button class="sec" id="recargar" aria-label="Recargar">↻</button>
</header>
<div class="muted" id="estado">Cargando…</div>

<section class="panel" id="avisos">
  <p id="avisos-texto">Comprobando avisos…</p>
  <button id="activar" class="oculto">Activar avisos</button>
  <div id="codigo" class="oculto">
    <p>Último paso: copia este código y pégalo como secreto <b>SUSCRIPCIONES_AVISOS</b> en GitHub (o pásaselo a Claude en el chat).</p>
    <textarea id="codigo-txt" readonly></textarea>
    <p><button id="copiar">Copiar código</button>
      <a class="btn" href="https://github.com/alexmoncho/PS5Find/settings/secrets/actions/new" target="_blank" rel="noopener">Abrir GitHub</a></p>
  </div>
</section>

<div class="chips" role="group" aria-label="Filtrar">
  <button class="chip" data-f="" aria-pressed="true">Todas</button>
  <button class="chip" data-f="PS5" aria-pressed="false">PS5</button>
  <button class="chip" data-f="Xbox Series" aria-pressed="false">Xbox Series</button>
  <button class="chip" data-f="mano" aria-pressed="false">En mano</button>
</div>

<main class="lista" id="lista"></main>

<script>
const $ = (id) => document.getElementById(id);
let datos = { anuncios: [] }, filtro = "";

function hace(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "ahora";
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.round(h / 24)} d`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function modeloDe(a) {
  if (a.modelo) return a.modelo;
  return /ps ?5|play ?station ?5|play ?5/i.test(a.titulo) ? "PS5" : "Xbox Series";
}

function pintar() {
  const lista = datos.anuncios.filter((a) =>
    !filtro || (filtro === "mano" ? /En mano/.test(a.entrega) : modeloDe(a) === filtro));
  $("lista").innerHTML = lista.length ? lista.map((a) => `
    <a class="anuncio" href="${esc(a.url)}" target="_blank" rel="noopener">
      <div class="fila"><div class="titulo">${esc(a.titulo)}</div><div class="precio">${Math.round(a.precio)} €</div></div>
      <div class="meta"><span>${esc(a.fuente)}</span><span class="entrega">${esc(a.entrega)}</span>
        ${a.ciudad ? `<span>${esc(a.ciudad)}</span>` : ""}<span>${hace(a.visto)}</span></div>
    </a>`).join("") : `<div class="vacio">Ahora mismo no hay anuncios que cumplan los filtros.</div>`;
}

async function cargar() {
  try {
    const r = await fetch(`anuncios.json?t=${Date.now()}`, { cache: "no-store" });
    datos = await r.json();
    const err = (datos.portales_con_error || []).length ? ` · <span class="aviso-err">sin respuesta: ${datos.portales_con_error.join(", ")}</span>` : "";
    $("estado").innerHTML = `${datos.anuncios.length} anuncios de los últimos 7 días · última comprobación ${hace(datos.actualizado)}${err}`;
  } catch (e) {
    $("estado").textContent = "No se han podido cargar los anuncios.";
  }
  pintar();
}

document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  pintar();
}));
$("recargar").addEventListener("click", cargar);
document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });

// --- Avisos (Web Push) ---
function b64aBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

function mostrarCodigo(sub) {
  $("codigo-txt").value = JSON.stringify(sub);
  $("codigo").classList.remove("oculto");
}

async function prepararAvisos() {
  const t = $("avisos-texto");
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    t.innerHTML = ios && !instalada
      ? "Para recibir avisos en iPhone, añade esta web a la pantalla de inicio (botón Compartir → <b>Añadir a pantalla de inicio</b>) y ábrela desde el icono."
      : "Este navegador no admite notificaciones. Prueba con Chrome (Android) o Safari instalado en la pantalla de inicio (iPhone).";
    return;
  }
  const reg = await navigator.serviceWorker.register("sw.js");
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === "granted") {
    t.textContent = "Avisos activados en este móvil.";
    $("activar").textContent = "Ver código de suscripción";
    $("activar").classList.remove("oculto");
    $("activar").classList.add("sec");
    $("activar").onclick = () => mostrarCodigo(sub);
    return;
  }
  t.textContent = ios && !instalada
    ? "Primero añade esta web a la pantalla de inicio (Compartir → Añadir a pantalla de inicio) y ábrela desde el icono."
    : "Activa los avisos para que te llegue una notificación con cada consola nueva.";
  if (ios && !instalada) return;
  $("activar").classList.remove("oculto");
  $("activar").onclick = async () => {
    try {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") { t.textContent = "Has denegado las notificaciones. Actívalas en los ajustes del navegador y vuelve a intentarlo."; return; }
      const v = await (await fetch(`vapid.json?t=${Date.now()}`, { cache: "no-store" })).json();
      if (!v.publicKey) { t.innerHTML = "Falta el secreto <b>CLAVE_AVISOS</b> en GitHub, o aún no ha pasado el rastreador desde que lo añadiste."; return; }
      const nueva = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(v.publicKey) });
      t.textContent = "Notificaciones permitidas.";
      $("activar").classList.add("oculto");
      mostrarCodigo(nueva);
    } catch (e) {
      t.textContent = "No se pudo activar: " + e.message;
    }
  };
}

$("copiar").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("codigo-txt").value); $("copiar").textContent = "Copiado"; }
  catch (_) { $("codigo-txt").select(); document.execCommand("copy"); $("copiar").textContent = "Copiado"; }
});

cargar();
prepararAvisos().catch((e) => { $("avisos-texto").textContent = "Error con los avisos: " + e.message; });
</script>
</body>
</html>
