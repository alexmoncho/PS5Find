name: Rastreo de consolas

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min; cabe en los 2.000 min gratis de un repo privado (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Filtros (pruebas)
        run: python -m unittest test_filtros
      - name: Rastrear
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python rastreador.py
      - name: Guardar estado y web
        run: |
          git config user.name "rastreador"
          git config user.email "rastreador@users.noreply.github.com"
          git add estado docs
          git diff --cached --quiet || git commit -m "Actualizar anuncios" && git push
