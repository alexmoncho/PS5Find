name: Rastreo de consolas

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min; cabe en los 2.000 min gratis de un repo privado (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo enviar una notificación de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rastreo
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install --quiet pywebpush==2.5.0
      - name: Pruebas
        run: python -m unittest test_filtros test_avisos
      - name: Rastrear
        env:
          CLAVE_AVISOS: ${{ secrets.CLAVE_AVISOS }}
          SUSCRIPCIONES_AVISOS: ${{ secrets.SUSCRIPCIONES_AVISOS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python rastreador.py ${{ inputs.prueba && '--prueba' || '' }}
      - name: Guardar estado y web
        run: |
          git config user.name "rastreador"
          git config user.email "rastreador@users.noreply.github.com"
          git add estado docs
          git diff --cached --quiet || git commit -m "Actualizar anuncios" && git push
